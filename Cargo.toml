[workspace]
resolver = "2"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.3"
edition = "2021"
rust-version = "1.92"
license = "GPL-3.0-or-later"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
crossbeam-channel = "0.5"
env_logger = "0.11"
# 只保留实际用到的 winit + femtovg + 软件渲染回退；
# 去掉未使用的 accessibility / system-tray，减小包体与初始化开销。
slint = { version = "1.18", default-features = false, features = [
    "std", "backend-default", "renderer-femtovg", "renderer-software", "compat-1-2",
] }
slint-build = "1.18"
# 0.6 的 AudioCodecParameters/AudioSpec/plane 新 API 已在 lime-audio 完成适配。
symphonia = { version = "0.6", default-features = false, features = [
    "mp3", "wav", "flac", "ogg", "vorbis", "aac", "isomp4", "alac", "aiff", "pcm",
] }
cpal = "0.18"
signalsmith-stretch = "0.1"
rusqlite = { version = "0.41", features = ["bundled"] }
hound = "3.5"
zstd = { version = "0.14", default-features = false }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
