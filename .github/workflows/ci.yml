name: CI

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.gitignore'
      - 'samples/**'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.gitignore'
      - 'samples/**'

env:
  CARGO_TERM_COLOR: always

jobs:
  warden:
    name: Warden (Static Checks & CI Parity)
    runs-on: ubuntu-latest
    env:
      WARDEN_VERSION: "0.2.0"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install cargo-warden
        run: |
          set -euo pipefail
          asset="cargo-warden-v${WARDEN_VERSION}-x86_64-unknown-linux-gnu"
          base="https://github.com/zkz098/cargo-warden/releases/download/v${WARDEN_VERSION}"
          curl -sSfL -o "$asset.tar.gz" "$base/$asset.tar.gz"
          curl -sSfL -o SHA256SUMS.txt "$base/SHA256SUMS.txt"
          grep -F "  $asset.tar.gz" SHA256SUMS.txt | sha256sum -c -
          tar -xzf "$asset.tar.gz"
          echo "$PWD/$asset" >> "$GITHUB_PATH"

      - name: Run cargo-warden static checks
        run: cargo warden check

  style:
    name: Code Style & Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Linux audio & GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libfontconfig1-dev libxkbcommon-dev libxkbcommon-x11-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Check code formatting
        run: cargo fmt --all -- --check

      - name: Clippy check
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    needs: [style]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libfontconfig1-dev libxkbcommon-dev libxkbcommon-x11-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev xvfb

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Cargo check
        run: cargo check --locked --workspace --all-targets

      # 显式列出所有 workspace 成员，由 `cargo warden ci-parity` 校验无遗漏
      - name: Run unit & integration tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum cargo test --locked -p lime-analyze -p lime-app -p lime-asr -p lime-audio -p lime-core -p lime-store -p xtask --all-targets --verbose

      - name: Run unit & integration tests (Windows)
        if: runner.os != 'Linux'
        run: cargo test --locked -p lime-analyze -p lime-app -p lime-asr -p lime-audio -p lime-core -p lime-store -p xtask --all-targets --verbose

  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit dependencies
        run: cargo audit
