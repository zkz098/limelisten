[package]
name = "lime-app"
version.workspace = true
edition.workspace = true
build = "build.rs"

[[bin]]
name = "limelisten"
path = "src/main.rs"

[features]
default = ["whisper"]
whisper = ["dep:lime-asr"]

[dependencies]
lime-core = { path = "../lime-core" }
lime-audio = { path = "../lime-audio" }
lime-analyze = { path = "../lime-analyze" }
lime-asr = { path = "../lime-asr", optional = true }
lime-store = { path = "../lime-store" }
slint.workspace = true
anyhow.workspace = true
log.workspace = true
env_logger.workspace = true
crossbeam-channel.workspace = true
rfd = "0.15"

[build-dependencies]
slint-build.workspace = true
# Windows 图标 + 版本信息（assets/limelisten.rc），自动找 rc.exe，非 Windows 自动跳过
embed-resource = "3"
